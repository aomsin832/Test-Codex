name: Tests
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall -q app.py src tests
      - name: Validate synthetic data
        run: |
          python - <<'PY'
          from src.target_engine import load_all_targets

          targets = load_all_targets("data/targets")
          assert targets, "No synthetic targets were loaded."
          assert all(record["company"]["fictional"] is True for record in targets.values())
          print(f"Validated {len(targets)} synthetic targets: {', '.join(targets)}")
          PY
