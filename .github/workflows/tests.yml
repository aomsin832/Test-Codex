name: Tests
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall -q app.py src tests
      - name: Validate synthetic data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from src.data_validation import validate_all

          targets_dir = Path("data/targets")
          target_dirs = sorted(path for path in targets_dir.iterdir() if path.is_dir())
          assert target_dirs, f"No target data directories found in {targets_dir}"

          validation_errors = {}
          for target_dir in target_dirs:
              with (target_dir / "company.json").open(encoding="utf-8") as company_file:
                  company = json.load(company_file)
              findings = pd.read_csv(target_dir / "findings.csv")
              errors = validate_all(company, findings)
              if errors:
                  validation_errors[target_dir.name] = errors

          assert not validation_errors, f"Invalid synthetic target data: {validation_errors}"
          print(f"Validated {len(target_dirs)} synthetic target data sets.")
          PY
